<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join VRUMY</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/navbar.css"><link rel="stylesheet" href="css/cards.css"><link rel="stylesheet" href="css/responsive.css"></head><body><header class="container"><nav class="nav"><a class="brand" href="index.html">VRU<span>MY</span></a></nav></header><main class="container" style="max-width:510px;padding:60px 0"><section class="booking-panel"><span class="eyebrow">MOVE WITH US</span><h1 class="section-title">Join VRUMY</h1><p>Create your demo account and start moving smarter.</p><form id="registerForm"><div class="field"><label>Full name</label><input name="name" required placeholder="Your name"></div><div class="field"><label>Email</label><input name="email" required type="email" placeholder="you@example.com"></div><div class="field"><label>Phone</label><input name="phone" required type="tel" placeholder="Your phone number"></div><div class="field"><label>Password</label><input name="password" required type="password" placeholder="Choose a password"></div><div class="field"><label>Account type</label><select name="role"><option value="user">Rent / book vehicles</option><option value="owner">Vehicle owner — list & earn</option></select></div><button class="btn btn-primary" style="width:100%;margin-top:20px">Create account</button></form><p>Already a member? <a style="color:#176bff;font-weight:bold" href="login.html">Log in</a></p></section></main><div class="modal" id="successModal"><div class="modal-box"><div class="modal-icon">✓</div><h2>Welcome to VRUMY</h2><p></p><a class="btn btn-primary" href="index.html">Start exploring</a></div></div><script src="js/main.js"></script><script>
document.getElementById('registerForm')?.addEventListener('submit',async e=>{
 e.preventDefault();const f=e.target;
 try{const data=await api('/auth/register',{method:'POST',body:JSON.stringify({name:f.name.value,email:f.email.value,phone:f.phone.value,password:f.password.value,role:f.role.value})});setSession(data);showModal('Welcome to VROOMY','Your account has been created.');setTimeout(()=>location.href='index.html',700)}
 catch(err){alert(err.message)}
});
</script></body></html>
