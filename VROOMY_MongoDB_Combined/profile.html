<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | VRUMY</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/navbar.css"><link rel="stylesheet" href="css/cards.css"><link rel="stylesheet" href="css/responsive.css"></head><body><header class="container"><nav class="nav"><a class="brand" href="index.html">VRU<span>MY</span></a><button class="menu-btn">☰</button><div class="nav-links"><a href="index.html">Home</a><a href="find-ride.html">Find a Ride</a><a href="rental.html">Rent a Vehicle</a><a href="offer-ride.html">Offer a Ride</a><a href="bookings.html">My Bookings</a><a class="active" href="profile.html">Profile</a></div><div class="nav-actions"><a href="login.html">Log in</a></div></nav></header><main class="container section"><span class="eyebrow">ACCOUNT</span><div class="profile-head" style="margin:15px 0 35px"><div class="avatar" id="avatar">V</div><div><h1 class="section-title" id="profileName" style="margin:0">VROOMY User</h1><p id="profileMeta" style="margin:5px 0">Loading profile...</p></div></div><div class="feature-grid"><article class="detail-panel"><h3>Profile details</h3><p><b>Email</b><br><span id="profileEmail">—</span></p><p><b>Phone</b><br><span id="profilePhone">—</span></p><p><b>Role</b><br><span class="pill" id="profileRole">—</span></p></article><article class="detail-panel"><h3>Account</h3><p>Your account and booking data are stored through the VROOMY backend and MongoDB Atlas.</p><button class="btn btn-outline" id="logoutBtn">Log out</button></article></div></main><script src="js/main.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const u=getStoredUser();if(!u){location.href="login.html";return}document.getElementById("profileName").textContent=u.name;document.getElementById("profileEmail").textContent=u.email;document.getElementById("profilePhone").textContent=u.phone||"—";document.getElementByI
